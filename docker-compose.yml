spring.application.name=RecipeProject
  
  # Database connection
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/recipedb
spring.datasource.username=postgres
spring.datasource.password=postgrespassword
spring.datasource.driver-class-name=org.postgresql.Driver
  
  # JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
  
  # Server port
server.port=8080
  
  # External Web Recipe Search
search.google.api-key=${GOOGLE_SEARCH_API_KEY:}
search.google.cx=${GOOGLE_SEARCH_CX:}